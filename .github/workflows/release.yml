name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - run: swift run MeetingAssistantChecks
      - run: zsh Scripts/build-app.sh release
      - name: Package macOS app
        run: |
          ditto -c -k --sequesterRsrc --keepParent .build/MeetingAssistant.app MeetingAssistant-macOS-arm64.zip
          mkdir dmg-root
          cp -R .build/MeetingAssistant.app dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname MeetingAssistant -srcfolder dmg-root -ov -format UDZO MeetingAssistant-macOS-arm64.dmg
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            MeetingAssistant-macOS-arm64.zip
            MeetingAssistant-macOS-arm64.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: windows/requirements.txt
      - name: Install build dependencies
        run: pip install -r windows/requirements.txt pyinstaller==6.16.0 pillow==11.3.0
      - run: python windows/meeting_assistant.py --self-check
      - name: Build Windows executable
        shell: pwsh
        run: |
          python -c "from PIL import Image; Image.open('Resources/AppIcon.png').save('Resources/AppIcon.ico', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])"
          pyinstaller --noconfirm --clean --onefile --windowed --name MeetingAssistant-Windows --icon Resources/AppIcon.ico --collect-all faster_whisper --collect-all ctranslate2 --collect-all av --collect-all soundcard --collect-all keyring windows/meeting_assistant.py
          Compress-Archive -Path dist/MeetingAssistant-Windows.exe -DestinationPath MeetingAssistant-Windows-x64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: MeetingAssistant-Windows-x64.zip

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/* --repo "${GITHUB_REPOSITORY}" --title "MeetingAssistant ${GITHUB_REF_NAME}" --generate-notes
